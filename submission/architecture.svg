<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f2f5f9; stroke: #334155; stroke-width: 1.5; }
    .box-blue { fill: #dbeafe; stroke: #1e40af; stroke-width: 1.5; }
    .box-green { fill: #dcfce7; stroke: #166534; stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: bold; fill: #111827; }
    .sub { font-size: 12px; fill: #374151; }
    .label { font-size: 12px; font-weight: bold; fill: #111827; }
    .note { font-size: 12px; fill: #6b7280; font-style: italic; }
  </style>

  <!-- Users -->
  <rect x="310" y="10" width="300" height="70" rx="8" class="box"/>
  <text x="460" y="35" text-anchor="middle" class="title">USERS</text>
  <text x="460" y="55" text-anchor="middle" class="sub">Admin / Issuer / Student / Verifier</text>

  <line x1="460" y1="80" x2="460" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- React -->
  <rect x="310" y="105" width="300" height="70" rx="8" class="box-blue"/>
  <text x="460" y="130" text-anchor="middle" class="title">REACT FRONTEND</text>
  <text x="460" y="150" text-anchor="middle" class="sub">11 pages: Home, Login, Dashboards, Register,</text>
  <text x="460" y="165" text-anchor="middle" class="sub">Verify, Revoke, Transactions, History, QR</text>

  <line x1="460" y1="175" x2="460" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="192" class="label">API</text>

  <!-- FastAPI -->
  <rect x="310" y="200" width="300" height="70" rx="8" class="box-blue"/>
  <text x="460" y="225" text-anchor="middle" class="title">PYTHON + FASTAPI BACKEND</text>
  <text x="460" y="245" text-anchor="middle" class="sub">Validate, generate ID, SHA-256, store metadata,</text>
  <text x="460" y="260" text-anchor="middle" class="sub">verify on-chain claims (read-only, web3.py)</text>

  <!-- PostgreSQL -->
  <rect x="60" y="320" width="300" height="110" rx="8" class="box-green"/>
  <text x="210" y="345" text-anchor="middle" class="title">PostgreSQL DATABASE</text>
  <text x="210" y="365" text-anchor="middle" class="sub">Issuer, CertificateMetadata,</text>
  <text x="210" y="382" text-anchor="middle" class="sub">VerificationLog</text>
  <text x="210" y="402" text-anchor="middle" class="sub">PDF files on disk (backend/uploads/)</text>

  <!-- Contract -->
  <rect x="560" y="320" width="300" height="110" rx="8" class="box-green"/>
  <text x="710" y="345" text-anchor="middle" class="title">SOLIDITY SMART CONTRACT</text>
  <text x="710" y="365" text-anchor="middle" class="sub">Certificate ID + SHA-256 Hash</text>
  <text x="710" y="382" text-anchor="middle" class="sub">+ Issuer Address + Status (ACTIVE / REVOKED)</text>
  <text x="710" y="402" text-anchor="middle" class="sub">Only authorized issuers can register / revoke</text>

  <line x1="360" y1="270" x2="210" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="295" class="label">Metadata</text>
  <line x1="560" y1="270" x2="710" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="295" class="label">Read-only verify</text>

  <!-- ethers.js write path -->
  <path d="M 610 140 L 760 140 L 760 320" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="770" y="145" class="label" fill="#92400e">Register / Revoke tx</text>
  <text x="770" y="162" class="sub" fill="#92400e">(React + ethers.js, via MetaMask</text>
  <text x="770" y="178" class="sub" fill="#92400e">or submit_tx.js; backend never sends tx)</text>

  <!-- Hardhat -->
  <line x1="710" y1="430" x2="710" y2="455" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="455" width="300" height="70" rx="8" class="box"/>
  <text x="710" y="480" text-anchor="middle" class="title">HARDHAT LOCAL BLOCKCHAIN</text>
  <text x="710" y="500" text-anchor="middle" class="sub">Local only. No mainnet, no real cryptocurrency.</text>
  <text x="710" y="515" text-anchor="middle" class="sub">Chain ID 31337. State is lost on restart.</text>

  <text x="460" y="570" text-anchor="middle" class="note">Never on-chain: personal information and the full certificate PDF.</text>
  <text x="460" y="590" text-anchor="middle" class="note">Source: project notes, Section 13, with the Phase 0 split (backend verifies, React sends tx) shown explicitly.</text>
</svg>
